name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Configs Directory & env.json
        run: |
          mkdir -p configs
          cat << 'EOF' > configs/env.json
          {
              "APP_ENV": "production",
              "API_BASE_URL": "https://api.lorofy.space/api/v1",
              "CONNECT_TIMEOUT_MS": 30000,
              "RECEIVE_TIMEOUT_MS": 30000,
              "GOOGLE_WEB_CLIENT_ID": "619075198415-3t6pl0vqvq9ibrq795icfinbnjor8nk8.apps.googleusercontent.com"
          }
          EOF

      - name: Install Dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS App (No Codesign)
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=configs/env.json

      - name: Package into IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r Lorofy.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lorofy-iOS-IPA
          path: Lorofy.ipa
